name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-audit:
    name: Release audit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release audit tests
        run: python3 -m unittest org_audit.test_contracts
      - name: Check Python and shell syntax
        run: |
          python3 -m compileall -q org_audit
          bash -n org_audit/run.sh
